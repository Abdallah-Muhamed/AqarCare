name: Backend CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'AqarCare/**'
      - 'AqarCare.Tests/**'
      - 'AqarCare.sln'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'AqarCare/**'
      - 'AqarCare.Tests/**'
      - 'AqarCare.sln'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test:
    name: Build & Test (.NET 8.0)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Cache NuGet Packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore Dependencies
      run: dotnet restore AqarCare.sln

    - name: Build Solution (Release)
      run: dotnet build AqarCare.sln --no-restore --configuration Release

    - name: Execute Automated Test Suite
      run: dotnet test AqarCare.sln --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

    - name: Publish Web API Release
      run: dotnet publish AqarCare/AqarCare.csproj --no-build --configuration Release --output ./publish

    - name: Upload Published Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: aqarcare-api-release
        path: ./publish
        retention-days: 7

  deploy:
    name: Continuous Deployment (Release)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Download Published Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: aqarcare-api-release
        path: ./artifacts

    - name: Verify Deployment Payload Integrity
      run: |
        echo "Validating release binaries..."
        test -f ./artifacts/AqarCare.dll && echo "Release binary AqarCare.dll validated successfully."
        ls -la ./artifacts

    - name: Deploy to Production Environment
      run: |
        echo "Deployment pipeline executed successfully for commit ${{ github.sha }} on ${{ github.ref_name }}."
